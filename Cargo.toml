[package]
name = "eclaire"
version = "0.1.4"
edition = "2021"
description = "Cross-language semantic UI layout engine powered by Clay"
license = "MIT AND Zlib"
repository = "https://github.com/brain-fuel/eclaire"
homepage = "https://github.com/brain-fuel/eclaire"
documentation = "https://docs.rs/eclaire"
readme = "README.md"
build = "bindings/rust/build.rs"
autoexamples = false
exclude = [
  "/bindings/fsharp/**",
  "/bindings/go/**",
  "/bindings/haskell/**",
  "/bindings/haskell-cli/**",
  "/cmd/**",
  "/examples/**",
  "/tests/**",
  "/cmake/**",
  "/scripts/**",
  "/go.mod",
  "/stack.yaml",
  "/stack.yaml.lock",
  "/eclaire.cabal",
  "/Makefile",
  "/CMakeLists.txt",
  "/build/**",
  "/dist/**",
  "/.stack-work/**",
  "**/node_modules/**",
  "**/dist-newstyle/**",
  "**/bin/**",
  "**/obj/**",
  "**/*.wasm",
]

[lib]
path = "bindings/rust/lib.rs"

[[bin]]
name = "eclaire"
path = "bindings/rust/main.rs"

[build-dependencies]
cc = "1"
